<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FitnessGuard</title>
    <link rel="stylesheet" href="auth.css">
    <style>
        /* Fallback icons if Font Awesome doesn't load */
        .fas.fa-user::before { content: "👤"; }
        .fas.fa-lock::before { content: "🔒"; }
        .fas.fa-envelope::before { content: "📧"; }
        .fas.fa-exclamation-triangle::before { content: "⚠️"; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Login</h1>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="loginUsername" value="07hashubham" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" value="password123" required>
                </div>
                
                <button type="submit" class="submit-btn">Submit</button>
                
                <div class="auth-links">
                    <a href="#" class="forgot-link" onclick="event.preventDefault(); event.stopPropagation(); document.getElementById('forgotPasswordModal').classList.remove('hidden'); document.getElementById('forgotPasswordModal').classList.add('show'); return false;">Forgot Password?</a>
                    <a href="#" class="signup-link" onclick="event.preventDefault(); event.stopPropagation(); if(!document.activeElement || document.activeElement.tagName !== 'INPUT') { document.querySelector('.login-container').classList.add('hidden'); document.querySelector('.register-container').classList.remove('hidden'); } return false;">SignUp</a>
                </div>
            </form>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>
    
    <!-- Hidden Register Form -->
    <div class="register-container hidden" id="registerContainer">
        <div class="login-card">
            <div class="login-header">
                <h1>Register</h1>
            </div>
            
            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="registerUsername" placeholder="Username" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="registerEmail" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="registerPassword" placeholder="Password" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>
                
                <button type="submit" class="submit-btn">Register</button>
                
                <div class="auth-links">
                    <a href="#" class="back-link" onclick="event.preventDefault(); event.stopPropagation(); if(!document.activeElement || document.activeElement.tagName !== 'INPUT') { document.querySelector('.login-container').classList.remove('hidden'); document.querySelector('.register-container').classList.add('hidden'); } return false;">← Back to Login</a>
                </div>
            </form>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div class="modal-overlay hidden" id="forgotPasswordModal">
        <div class="forgot-password-modal">
            <div class="modal-close" onclick="document.getElementById('forgotPasswordModal').classList.remove('show'); document.getElementById('forgotPasswordModal').classList.add('hidden'); return false;">
                <i class="fas fa-times"></i>
            </div>
            <div class="modal-header">
                <h2>Reset Password</h2>
                <p>Enter your email address and we'll send you a reset link</p>
            </div>
            <form id="forgotPasswordForm" class="forgot-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="forgotEmail" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="submit-btn">Send Reset Link</button>
                <div class="auth-links">
                    <a href="#" class="back-link" onclick="document.getElementById('forgotPasswordModal').classList.remove('show'); document.getElementById('forgotPasswordModal').classList.add('hidden'); return false;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
