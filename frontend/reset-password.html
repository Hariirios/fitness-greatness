<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FitnessGuard</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Reset Password</h1>
                <p style="color: #9ca3af; font-size: 16px; margin-top: 10px;">Enter your new password</p>
            </div>
            
            <form id="resetPasswordForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="newPassword" placeholder="New Password" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                </div>
                
                <button type="submit" class="submit-btn">Reset Password</button>
                
                <div class="auth-links" style="justify-content: center;">
                    <a href="auth.html" class="back-link">← Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000';
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            alert('Invalid reset link');
            window.location.href = 'auth.html';
        }
        
        // Handle form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = e.target.querySelector('.submit-btn');
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            // Loading state
            submitBtn.innerHTML = 'Resetting...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: newPassword })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    submitBtn.innerHTML = '✓ Password Reset!';
                    submitBtn.style.borderColor = '#10b981';
                    submitBtn.style.color = '#10b981';
                    
                    alert('Password reset successfully! You can now login with your new password.');
                    
                    setTimeout(() => {
                        window.location.href = 'auth.html';
                    }, 2000);
                } else {
                    alert(data.error || 'Failed to reset password');
                    submitBtn.innerHTML = 'Reset Password';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('Failed to connect to server');
                submitBtn.innerHTML = 'Reset Password';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
